<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="account.css">
    <title>Login    </title>
</head>
<body>
    <div class="bass_center">
        <div class="for_photo">
            <div class="welcome-text">
                <h1 style=" font-size: 50px; font-style: italic;color: white;display: flex;justify-content: center;">Welcome back to Lexer</h1>
                <p style="font-size: 25px; font-style: italic; color: white;display: flex;justify-content: center;">Sign in to access your commerce analytics dashboard.</p>
            </div>
        </div>
        <!-- ---------------------------- -->
         <div class="control_login">
            <br>
            <h1 style="font-style: italic;font-size: 50px;color: green;" class="center">Lexer</h1>
            <h2 style="font-style: italic;font-size: 30px;" class="center">Welcome back to Lexer</h2>
            <p class="center">Sigin in to access your commerce analytice dashboard</p>
<br>
            <form>
                <input class="for_input" type="eamil" id="user_name" placeholder="Email Address">
                <br><br>
                <input class="for_input" type="password" id="pass" placeholder="Password">
                <br>
                <p style="color: green;display: block;justify-content: center;align-items: center; margin: auto;margin-left:50%;cursor: pointer;">Forgot Password?</p>
                <br>
                <button style="background-color: rgb(73, 224, 73);border: none;" class="for_input1" id="btn-sub" type="button"><p>Sign In</p></button>
            </form>
            <div class="center_text">
                <hr style="width: 35%;"><p>Or sign in with</p><hr style="width: 35%;">
            </div>
            <div style="display: flex;gap: 10px;" class="center">
                <button class="btn">
                    <img  src="./photo/google.png" width="30px" alt="">
                </button>
                <button class="btn">
                    <img src="./photo/Microsoft_logo.svg.jpg" width="30px" alt="">
                </button>
            </div>
            <p class="center" style="font-size: 15px;">Don't have an account? Contact Sales to Get Started</p>
         </div>
    </div>
