<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details</title>
    <link rel="stylesheet" href="ViewStyle.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>
  <body>
    <div class="container">
      <div class="product-wrapper">
        <div class="product-images">
          <div class="main-image">
            <img id="mainImage" src="./images/Rogshoes.png" />

            <button class="arrow left-arrow" onclick="prevImage()">
              <i class="fa-solid fa-chevron-left"></i>
            </button>

            <button class="arrow right-arrow" onclick="nextImage()">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <div class="thumbnail-container">
            <div class="color-product active">
              <img src="./images/Gbblack.png" onclick="changeImage(this)" />
            </div>

            <div class="color-product">
              <img src="./images/grayshoes.png" onclick="changeImage(this)" />
            </div>

            <div class="color-product">
              <img src="./images/nike.png" onclick="changeImage(this)" />
            </div>

            <div class="color-product">
              <img src="./images/Rogshoes.png" onclick="changeImage(this)" />
            </div>
          </div>
        </div>

        <div class="product-info">
          <div class="brand">Rog Nike Shoes</div>

          <div class="title">Premuim desgin</div>

          <div class="price">
            <div class="old-price">$40.00</div>
            <div class="new-price">$32.99</div>
          </div>

          <div class="rating">
            <span>1,238 Sold</span>

            <span>
              <i class="fa-solid fa-star star"></i>
              6.7
            </span>
          </div>

          <div class="description">
            <h3>Description:</h3>

            <p>
              Modern overshirt design with premium cotton fabric. Perfect for
              casual and streetwear fashion styles.
            </p>
          </div>

          <div class="sizes">
            <div class="sizes-header">
              <h3>Size:</h3>
              <a href="#">View Size Chart</a>
            </div>

            <div class="size-buttons">
              <button class="size active">S</button>
              <button class="size">M</button>
              <button class="size">L</button>
              <button class="size">XL</button>
              <button class="size">XXL</button>
            </div>
          </div>

          <div class="buttons">
            <button class="btn cart-btn">Add To Cart</button>

            <button class="btn checkout-btn">Checkout Now</button>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="Details.js"></script>
  </body>
</html>
