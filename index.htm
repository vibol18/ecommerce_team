<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lexer Navbar</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="switcher"> 
    <span class="label">Theme:</span>
    <button class="theme-btn selected" onclick="setTheme('teal', this)">Teal dark</button>
    <button class="theme-btn" onclick="setTheme('purple', this)">Purple dark</button>
    <button class="theme-btn" onclick="setTheme('navy', this)">Navy blue</button>
    <button class="theme-btn" onclick="setTheme('charcoal', this)">Charcoal</button>
    <button class="theme-btn" onclick="setTheme('forest', this)">Forest</button>
    <button class="theme-btn rainbow-btn" onclick="setTheme('rainbow', this)"> Rainbow</button>
  </div>

  <!-- Top Navbar -->
  <div id="navbar" class="navbar">
    <div id="logo" class="logo">lexer</div>
    <div class="nav-links">
      <span class="nav-link active" onclick="setActive(this)">Marketing</span>
      <span class="nav-link" onclick="setActive(this)">Service</span>
      <span class="nav-link" onclick="setActive(this)">Monitoring</span>
      <span class="nav-link" onclick="setActive(this)">Integrations</span>
      <span class="nav-link" onclick="setActive(this)">Settings</span>
      <div class="cart  flex justify" id="cart">
        <i class="fa-solid fa-cart-arrow-down"></i>
        <h1 >card</h1>
      </div>
    </div>
  </div>
  <!-- Sub Navbar -->
  <div id="subnav" class="subnav">
    <span class="sub-link active" onclick="setSubActive(this)">Measure <span class="badge">new</span></span>
    <span class="sub-link" onclick="setSubActive(this)">Segment &amp; explore <span class="badge">new</span></span>
    <span class="sub-link" onclick="setSubActive(this)">Analyse <span class="badge">new</span></span>
    <span class="sub-link" onclick="setSubActive(this)">Compare <span class="badge">new</span></span>
  </div>

<!-- BODY -->
<div class="p-4">
  <div class="swiper mySwiper rounded-2xl overflow-hidden shadow-lg">
    <div class="swiper-wrapper">

      <div class="swiper-slide relative">
        <div class="">
        <img src="https://media.istockphoto.com/id/637372676/photo/internet-shopping-and-e-commerce-package-delivery-concept.jpg?s=612x612&w=0&k=20&c=Vc4k3vuPSY6BHVN865giYGgghvz3i3WDTgaLWFMjEd0=" class="w-full h-72 object-cover" alt="Slide 1" />
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-5">
          <span class="text-xs font-semibold text-white/70 uppercase tracking-widest">Subtitle</span>
          <h2 class="text-white text-xl font-bold mt-1">Title</h2>
        </div>
        </div>
      </div>

      <div class="swiper-slide relative">
        <img src="https://img.freepik.com/free-vector/3d-isometric-e-commerce-concept-online-store_1441-2128.jpg?semt=ais_hybrid&w=740&q=80" class="w-full h-72 object-cover" alt="Slide 2" />
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-5">
          <span class="text-xs font-semibold text-white/70 uppercase tracking-widest">Subtitle</span>
          <h2 class="text-white text-xl font-bold mt-1">Title</h2>
        </div>
      </div>

       <div class="swiper-slide relative">
        <img src="https://pagecreative.co.uk/wp-content/uploads/2023/10/AdobeStock_223290240-1-2-scaled.jpeg" class="w-full h-72 object-cover" alt="Slide 2" />
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 to-transparent p-5">
          <span class="text-xs font-semibold text-white/70 uppercase tracking-widest">Subtitle</span>
          <h2 class="text-white text-xl font-bold mt-1">Title</h2>
        </div>
      </div>

    </div>
    <div class="swiper-pagination"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-scrollbar"></div>
  </div>
</div>
  <!-- Page Content -->
  <div id="content" class="content-area">Page content area</div>
 <!-- Circle-container -->
   <div class="py-12 px-8 bg-gray-100" id="category_circle">

      />

    </div>

    <div

    >
      <img
        class="w-24 h-24 rounded-full object-cover border-4 border-indigo-500 mx-auto"
        src="https://i.pinimg.com/1200x/47/a4/49/47a44923fe5fda884203a25c06e3c96c.jpg"
        alt="Graphic"
      />
      <p class="mt-4 text-lg font-semibold text-gray-700">
        Graphic Card
      </p>
    </div>

    <div
      class="bg-white rounded-3xl shadow-md hover:shadow-xl hover:-translate-y-2 transition duration-300 p-5 text-center cursor-pointer"
    >
      <img
        class="w-24 h-24 rounded-full object-cover border-4 border-indigo-500 mx-auto"
        src="https://i.pinimg.com/1200x/47/a4/49/47a44923fe5fda884203a25c06e3c96c.jpg"
        alt="Graphic"
      />
      <p class="mt-4 text-lg font-semibold text-gray-700">
        Graphic Card

  </div>
</div>

  </body>
